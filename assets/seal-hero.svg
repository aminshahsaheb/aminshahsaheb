<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amin Shahsaheb — a self-audited ledger of work across business, technology, AI and markets">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#15803d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10130f"/>
      <stop offset="100%" stop-color="#0a0c0a"/>
    </linearGradient>
    <path id="ringpath" d="M 900,16 A 184,184 0 1 1 899.99,16" />
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#ink)"/>

  <!-- faint hairline frame, quiet -->
  <rect x="24" y="24" width="1152" height="352" fill="none" stroke="#243228" stroke-opacity="0.35" stroke-width="1"/>

  <!-- glow behind the medallion -->
  <circle cx="900" cy="200" r="210" fill="url(#glow)"/>

