  <line x1="70" y1="196" x2="430" y2="196" stroke="#243228" stroke-width="1"/>
  <text x="70" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#a9b8b0">Business, technology and AI — held to the</text>
