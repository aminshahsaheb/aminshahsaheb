  <text font-family="Georgia, 'Times New Roman', serif" font-size="12.5" letter-spacing="4" fill="#7fb69e" fill-opacity="0.8">
    <textPath href="#ringpath" startOffset="0%">CLAIM · EVIDENCE · WITNESS · SEAL · CLAIM · EVIDENCE · WITNESS · SEAL · CLAIM · EVIDENCE · WITNESS · SEAL · CLAIM · EVIDENCE · WITNESS · SEAL ·</textPath>
  </text>

