<rect width="1600" height="390" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="388" rx="21" fill="none" stroke="#d8e5dc" stroke-opacity=".19"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2.5" fill="#b4c4b8"><text x="54" y="52">OPERATING METHOD / FROM QUESTION TO EVIDENCE</text><text x="1546" y="52" text-anchor="end">A REPEATABLE LOOP</text></g>
