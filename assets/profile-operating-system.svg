<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 390" role="img" aria-labelledby="t d">
<title id="t">A five-stage working method</title><desc id="d">Understand, frame, design, build and verify, shown as an architectural process path.</desc>
