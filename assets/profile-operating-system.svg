<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g><circle cx="190" cy="176" r="54" fill="#111b16" stroke="#73d6a0" stroke-opacity=".8" stroke-width="1.5"/><circle cx="190" cy="176" r="44" fill="none" stroke="#73d6a0" stroke-opacity=".24"/><text x="190" y="170" fill="#f1f0e9" font-size="16" font-weight="700">UNDERSTAND</text><text x="190" y="195" fill="#c0d5c7" font-size="11">THE PROBLEM</text><text x="190" y="266" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="11">01</text><text x="190" y="290" fill="#b4c4b8" font-size="12">Find the real need</text></g>
 <g><circle cx="490" cy="176" r="54" fill="#171811" stroke="#e0b96f" stroke-opacity=".8" stroke-width="1.5"/><circle cx="490" cy="176" r="44" fill="none" stroke="#e0b96f" stroke-opacity=".24"/><text x="490" y="170" fill="#f1f0e9" font-size="16" font-weight="700">FRAME</text><text x="490" y="195" fill="#d0c09b" font-size="11">SCOPE &amp; RULES</text><text x="490" y="266" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="11">02</text><text x="490" y="290" fill="#b4c4b8" font-size="12">Set clear boundaries</text></g>
 <g><circle cx="790" cy="176" r="54" fill="#111820" stroke="#79bde8" stroke-opacity=".8" stroke-width="1.5"/><circle cx="790" cy="176" r="44" fill="none" stroke="#79bde8" stroke-opacity=".24"/><text x="790" y="170" fill="#f1f0e9" font-size="16" font-weight="700">DESIGN</text><text x="790" y="195" fill="#aabfce" font-size="11">THE SYSTEM</text><text x="790" y="266" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="11">03</text><text x="790" y="290" fill="#b4c4b8" font-size="12">Map roles and structure</text></g>
 <g><circle cx="1090" cy="176" r="54" fill="#111b16" stroke="#73d6a0" stroke-opacity=".8" stroke-width="1.5"/><circle cx="1090" cy="176" r="44" fill="none" stroke="#73d6a0" stroke-opacity=".24"/><text x="1090" y="170" fill="#f1f0e9" font-size="16" font-weight="700">BUILD</text><text x="1090" y="195" fill="#c0d5c7" font-size="11">IN SMALL STEPS</text><text x="1090" y="266" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="11">04</text><text x="1090" y="290" fill="#b4c4b8" font-size="12">Make work testable</text></g>
 <g><circle cx="1390" cy="176" r="54" fill="#1a1811" stroke="#efcb7b" stroke-opacity=".9" stroke-width="1.5"/><circle cx="1390" cy="176" r="44" fill="none" stroke="#efcb7b" stroke-opacity=".28"/><text x="1390" y="170" fill="#f1f0e9" font-size="16" font-weight="700">VERIFY</text><text x="1390" y="195" fill="#c8b68e" font-size="11">AGAINST EVIDENCE</text><text x="1390" y="266" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="11">05</text><text x="1390" y="290" fill="#b4c4b8" font-size="12">Record what is true</text></g>
