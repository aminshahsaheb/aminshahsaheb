 <linearGradient id="biz" x2="1" y2="1"><stop stop-color="#3a3427"/><stop offset="1" stop-color="#211f19"/></linearGradient>
 <linearGradient id="rule" x2="1"><stop stop-color="#d7bd87" stop-opacity="0"/><stop offset=".5" stop-color="#d7bd87" stop-opacity=".7"/><stop offset="1" stop-color="#d7bd87" stop-opacity="0"/></linearGradient>
