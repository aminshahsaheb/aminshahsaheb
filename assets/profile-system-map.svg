<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" role="img" aria-labelledby="t d">
<title id="t">Three fields, one working discipline</title><desc id="d">Fanus, MarketFa and BTC Signal Lab shown as three separate disciplines with different visual identities.</desc>
