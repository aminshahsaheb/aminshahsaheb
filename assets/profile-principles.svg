<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" role="img" aria-labelledby="t d">
<title id="t">Five working principles</title><desc id="d">Truth before presentation, clear boundaries, human agency, evidence over assumption, and continuity without captivity.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d0c"/><stop offset="1" stop-color="#121a15"/></linearGradient></defs>
<rect width="1600" height="340" rx="22" fill="url(#bg)" stroke="#d8e5dc" stroke-opacity=".21"/>
<g font-family="monospace" font-size="11" letter-spacing="2" fill="#b4c4b8"><text x="48" y="48">PRINCIPLES / THE STANDARD BEHIND THE WORK</text><text x="1552" y="48" text-anchor="end">05 RULES</text></g>
<g transform="translate(42 82)">
<g><rect width="288" height="210" rx="12" fill="#111b16" stroke="#73d6a0" stroke-opacity=".55"/><path d="M0 0H288" stroke="#73d6a0" stroke-width="3"/><text x="24" y="45" fill="#efcb7b" font-family="monospace" font-size="12">01</text><text x="24" y="91" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">Truth before</text><text x="24" y="120" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">presentation</text><text x="24" y="168" fill="#c0d5c7" font-family="Arial,sans-serif" font-size="13">Claims must match evidence.</text></g>
<g transform="translate(304 0)"><rect width="288" height="210" rx="12" fill="#191811" stroke="#e0b96f" stroke-opacity=".55"/><path d="M0 0H288" stroke="#e0b96f" stroke-width="3"/><text x="24" y="45" fill="#efcb7b" font-family="monospace" font-size="12">02</text><text x="24" y="91" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">Clear</text><text x="24" y="120" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">boundaries</text><text x="24" y="168" fill="#c4b99a" font-family="Arial,sans-serif" font-size="13">Separate roles and sources.</text></g>
<g transform="translate(608 0)"><rect width="288" height="210" rx="12" fill="#111820" stroke="#79bde8" stroke-opacity=".55"/><path d="M0 0H288" stroke="#79bde8" stroke-width="3"/><text x="24" y="45" fill="#b5d1e6" font-family="monospace" font-size="12">03</text><text x="24" y="91" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">Human</text><text x="24" y="120" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">agency</text><text x="24" y="168" fill="#a5b8c6" font-family="Arial,sans-serif" font-size="13">People stay in control.</text></g>
<g transform="translate(912 0)"><rect width="288" height="210" rx="12" fill="#111b16" stroke="#73d6a0" stroke-opacity=".55"/><path d="M0 0H288" stroke="#73d6a0" stroke-width="3"/><text x="24" y="45" fill="#efcb7b" font-family="monospace" font-size="12">04</text><text x="24" y="91" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">Evidence over</text><text x="24" y="120" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">assumption</text><text x="24" y="168" fill="#c0d5c7" font-family="Arial,sans-serif" font-size="13">Test ideas. Record unknowns.</text></g>
<g transform="translate(1216 0)"><rect width="300" height="210" rx="12" fill="#1a1812" stroke="#e0b96f" stroke-opacity=".55"/><path d="M0 0H300" stroke="#e0b96f" stroke-width="3"/><text x="24" y="45" fill="#efcb7b" font-family="monospace" font-size="12">05</text><text x="24" y="91" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">Continuity without</text><text x="24" y="120" fill="#f1f0e9" font-family="Georgia,serif" font-size="23">captivity</text><text x="24" y="168" fill="#c4b99a" font-family="Arial,sans-serif" font-size="13">Preserve context, not control.</text></g>
</g></svg>