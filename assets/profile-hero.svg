<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
<title id="title">Amin Shahsaheb — Build, Connect, Verify</title>
<desc id="desc">A restrained architectural identity banner. Persian eight-fold geometry, an open arch, fine construction lines and three connected system nodes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d0c"/><stop offset=".52" stop-color="#101713"/><stop offset="1" stop-color="#080b0a"/></linearGradient>
 <radialGradient id="atmo"><stop stop-color="#73d6a0" stop-opacity=".12"/><stop offset="1" stop-color="#73d6a0" stop-opacity="0"/></radialGradient>
 <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#efcb7b"/><stop offset=".5" stop-color="#9c8359"/><stop offset="1" stop-color="#e5d3a8"/></linearGradient>
 <linearGradient id="jade" x1="0" x2="1"><stop stop-color="#73d6a0" stop-opacity="0"/><stop offset=".5" stop-color="#b5ebc9" stop-opacity=".75"/><stop offset="1" stop-color="#73d6a0" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d8e5dc" stroke-opacity=".035"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1800" height="720" rx="28" fill="url(#bg)"/>
<ellipse cx="1320" cy="340" rx="560" ry="430" fill="url(#atmo)"/>
<rect width="1800" height="720" rx="28" fill="url(#grid)"/>
<rect x="28" y="28" width="1744" height="664" rx="18" fill="none" stroke="#d8e5dc" stroke-opacity=".24"/>
<path d="M92 92H1708M92 628H1708" stroke="#d8e5dc" stroke-opacity=".24"/>
<g fill="#a9bdb0" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="3">
 <text x="104" y="74">INDEPENDENT BUILDER / SYSTEMS &amp; PRODUCTS</text>
 <text x="1696" y="74" text-anchor="end">EST. IN CURIOSITY · GROUNDED IN EVIDENCE</text>
 <text x="104" y="666">BUSINESS</text><text x="246" y="666">TECHNOLOGY</text><text x="430" y="666">APPLIED AI</text><text x="578" y="666">MARKET RESEARCH</text>
 <text x="1696" y="666" text-anchor="end">BUILD / CONNECT / VERIFY</text>
</g>
<g transform="translate(104 202)">
 <text x="0" y="0" fill="#efcb7b" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="4">A PERSONAL WORKING PRINCIPLE</text>
 <path d="M0 28H520" stroke="url(#brass)" stroke-opacity=".65"/>
 <text x="0" y="112" fill="#f1f0e9" font-family="Georgia,Times New Roman,serif" font-size="66" letter-spacing="-1">Build with intent.</text>
 <text x="0" y="190" fill="#f1f0e9" font-family="Georgia,Times New Roman,serif" font-size="66" letter-spacing="-1">Verify with care.</text>
 <text x="2" y="252" fill="#d3e0d8" font-family="Arial,Helvetica,sans-serif" font-size="21">Turning complex questions into useful systems,</text>
 <text x="2" y="286" fill="#d3e0d8" font-family="Arial,Helvetica,sans-serif" font-size="21">digital products and evidence-led decisions.</text>
 <path d="M0 338H430" stroke="#d8e5dc" stroke-opacity=".28"/>
 <text x="2" y="372" fill="#adc1b3" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="2">STRATEGY → ARCHITECTURE → PRODUCT → EVIDENCE</text>
</g>
<g transform="translate(1320 364)">
