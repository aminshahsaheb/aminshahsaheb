 <g stroke="#b5ebc9" stroke-opacity=".45" fill="none"><path d="M-194 0C-270-30-280-110-254-172M194 0C270 30 280 110 254 172"/></g>
 <g fill="#efcb7b"><circle cx="-254" cy="-172" r="4"/><circle cx="254" cy="172" r="4"/></g>
 <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#b6cabc" letter-spacing="2">
  <text x="0" y="-224" text-anchor="middle">STRUCTURE</text><text x="224" y="4">SYSTEM</text><text x="0" y="232" text-anchor="middle">EVIDENCE</text><text x="-224" y="4" text-anchor="end">PURPOSE</text>
 </g>
