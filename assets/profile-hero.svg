<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Amin Shahsaheb — Business, Technology, AI, Markets</title>
  <desc id="desc">A dark technical identity composition combining Persian geometric architecture with systems, AI and market signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050708"/>
      <stop offset="0.52" stop-color="#08110f"/>
      <stop offset="1" stop-color="#030506"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="48%" r="48%">
      <stop offset="0" stop-color="#35d09a" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#35d09a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#35d09a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b7ffe2" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62f2b2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#62f2b2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#62f2b2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#glow)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <!-- Persian-inspired geometric seal: an eight-point star inside an architectural arch -->
  <g transform="translate(1190 300)">
    <path d="M-205 205V-35C-205-170-115-235 0-235S205-170 205-35v240" fill="none" stroke="#75f2bd" stroke-opacity=".13" stroke-width="2"/>
    <path d="M-172 205V-28C-172-133-98-188 0-188S172-133 172-28v233" fill="none" stroke="#75f2bd" stroke-opacity=".22" stroke-width="1.5"/>
    <g transform="rotate(22.5)">
      <path d="M0-142L31-44L100-100L44-31L142 0L44 31L100 100L31 44L0 142L-31 44L-100 100L-44 31L-142 0L-44-31L-100-100L-31-44Z" fill="none" stroke="#8affca" stroke-opacity=".5" stroke-width="2"/>
      <circle r="104" fill="none" stroke="#8affca" stroke-opacity=".16"/>
      <circle r="63" fill="none" stroke="#8affca" stroke-opacity=".32"/>
    </g>
    <circle r="8" fill="#9affd0" opacity=".85"/>
    <path d="M-230 205H230" stroke="url(#line)"/>
  </g>

  <!-- signal / system trace -->
  <g fill="none" stroke="#72eeb8" stroke-opacity=".32">
    <path d="M870 455L940 418L995 438L1050 366L1110 389L1170 310L1230 334L1290 255L1360 286L1430 205"/>
    <path d="M870 474H1430" stroke-opacity=".10"/>
  </g>
  <g fill="#a6ffda">
    <circle cx="940" cy="418" r="3"/><circle cx="1050" cy="366" r="3"/><circle cx="1170" cy="310" r="3"/><circle cx="1290" cy="255" r="3"/><circle cx="1430" cy="205" r="3"/>
  </g>

  <!-- identity -->
  <g fill="#effff8" font-family="Arial, Helvetica, sans-serif">
    <text x="100" y="174" font-size="22" letter-spacing="7" fill="#76eeb8">AMIN SHAHSÂHEB</text>
    <text x="100" y="247" font-size="62" font-weight="700" letter-spacing="3">BUSINESS × TECHNOLOGY</text>
    <text x="100" y="315" font-size="62" font-weight="700" letter-spacing="3">AI × MARKETS</text>
    <text x="100" y="372" font-size="20" letter-spacing="3" fill="#b9d8cb">BUILDING USEFUL SYSTEMS AT THE EDGE OF HUMAN + MACHINE</text>
  </g>

  <!-- small navigation labels -->
  <g font-family="monospace" font-size="13" letter-spacing="2" fill="#87b5a4">
    <text x="102" y="518">BUSINESS</text>
    <text x="270" y="518">PRODUCT</text>
    <text x="425" y="518">SYSTEMS</text>
    <text x="578" y="518">CONTINUITY</text>
    <text x="770" y="518">VERIFICATION</text>
  </g>
  <path d="M100 548H790" stroke="url(#line)"/>
  <text x="100" y="578" font-family="monospace" font-size="12" letter-spacing="2" fill="#5e8c7b">PERSIAN GEOMETRY / MODERN COMPUTATION / PRACTICAL CREATION</text>

  <rect x="24" y="24" width="1552" height="572" rx="18" fill="none" stroke="#a7ffdc" stroke-opacity=".10"/>
</svg>
