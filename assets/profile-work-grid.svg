<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
<title id="t">Selected projects</title><desc id="d">Three distinct projects: Fanus human AI systems, MarketFa business software and BTC Signal Lab evidence-first market research.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050907"/><stop offset="1" stop-color="#0b1711"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5f5d1" stroke-opacity=".04"/></pattern></defs>
