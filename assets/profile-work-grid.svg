<text x="62" y="72" fill="#789989" font-family="monospace" font-size="12" letter-spacing="3">SELECTED WORK / THREE DISTINCT SYSTEMS</text><text x="62" y="122" fill="#effff5" font-family="Arial,sans-serif" font-size="34" font-weight="700">Different domains. A consistent standard of work.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(62 166)"><rect width="470" height="270" rx="15" fill="#09170f" stroke="#83e9b5" stroke-opacity=".55"/><text x="28" y="42" fill="#82dca9" font-family="monospace" font-size="12" letter-spacing="2">01 / HUMAN–AI SYSTEMS</text><text x="28" y="100" fill="#f0fff6" font-size="32" font-weight="700">FĀNUS</text><text x="28" y="139" fill="#b2c9bc" font-size="16">Context · Continuity · Verification</text><path d="M28 178H442" stroke="#b9f8d7" stroke-opacity=".18"/><text x="28" y="212" fill="#d9ffea" font-size="14">Honest interaction, without captivity.</text><text x="28" y="244" fill="#6f9480" font-family="monospace" font-size="11">PROTOCOL / ENGINE / EXPERIENCES</text></g>
<g transform="translate(565 166)"><rect width="470" height="270" rx="15" fill="#09170f" stroke="#83e9b5" stroke-opacity=".55"/><text x="28" y="42" fill="#82dca9" font-family="monospace" font-size="12" letter-spacing="2">02 / BUSINESS SOFTWARE</text><text x="28" y="100" fill="#f0fff6" font-size="32" font-weight="700">MARKETFA</text><text x="28" y="139" fill="#b2c9bc" font-size="16">Operations · Workspaces · Capabilities</text><path d="M28 178H442" stroke="#b9f8d7" stroke-opacity=".18"/><text x="28" y="212" fill="#d9ffea" font-size="14">One platform, many kinds of work.</text><text x="28" y="244" fill="#6f9480" font-family="monospace" font-size="11">SHARED CORE / INDUSTRY WORKSPACES</text></g>
<g transform="translate(1068 166)"><rect width="470" height="270" rx="15" fill="#09170f" stroke="#83e9b5" stroke-opacity=".55"/><text x="28" y="42" fill="#82dca9" font-family="monospace" font-size="12" letter-spacing="2">03 / MARKET RESEARCH</text><text x="28" y="100" fill="#f0fff6" font-size="30" font-weight="700">BTC SIGNAL LAB</text><text x="28" y="139" fill="#b2c9bc" font-size="16">Hypotheses · Risk · Reproducibility</text><path d="M28 178H442" stroke="#b9f8d7" stroke-opacity=".18"/><text x="28" y="212" fill="#d9ffea" font-size="14">Evidence before claims of an edge.</text><text x="28" y="244" fill="#6f9480" font-family="monospace" font-size="11">RESEARCH / VALIDATION / AUDIT</text></g>
</g>
