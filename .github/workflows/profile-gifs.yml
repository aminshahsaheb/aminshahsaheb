name: Generate animated profile artwork

on:
  push:
    branches:
      - main
    paths:
      - "assets/profile-hero.svg"
      - "assets/profile-system-map.svg"
      - "assets/profile-operating-system.svg"
      - "assets/profile-work-grid.svg"
      - "assets/profile-signal.svg"
      - "assets/profile-connect.svg"
      - "scripts/generate_profile_gifs.py"
      - ".github/workflows/profile-gifs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-gif-generation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering tools
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG

      - name: Render animated profile artwork from source SVG files
        run: python scripts/generate_profile_gifs.py

      - name: Commit generated GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.gif
          if git diff --cached --quiet; then
            echo "GIF assets are already up to date."
          else
            git commit -m "Generate animated profile artwork"
            git push origin HEAD:main
          fi
